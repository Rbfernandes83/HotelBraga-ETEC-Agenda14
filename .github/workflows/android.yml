name: Compilar Hotel Braga Agenda 14

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Instalar MAUI Android
        run: dotnet workload install maui-android
      - name: Compilar APK
        run: dotnet publish HotelBraga.csproj -f net8.0-android -c Release -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false
      - uses: actions/upload-artifact@v4
        with:
          name: HotelBraga-Agenda14-APK
          path: '**/bin/Release/net8.0-android/**/*.apk'
